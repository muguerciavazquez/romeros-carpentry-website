<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estimate Request Sent | ROMERO'S CARPENTRY</title>
  <meta name="description" content="Your estimate request has been sent to ROMERO'S CARPENTRY." />
  <style>
    :root {
      --bg: #070707;
      --surface: #121110;
      --text: #f7f3eb;
      --muted: #b9afa0;
      --gold: #b9854e;
      --gold-2: #e3bd7d;
      --line: rgba(227, 189, 125, .22);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(185, 133, 78, .2), transparent 28rem),
        linear-gradient(180deg, #050505, #11100f);
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }
    img {
      width: 118px;
      height: 104px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #050505;
      padding: 8px;
      margin: 0 auto 24px;
    }
    .eyebrow {
      display: inline-flex;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--gold-2);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 900;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(38px, 7vw, 68px);
      line-height: .95;
      text-transform: uppercase;
    }
    p {
      margin: 0 auto;
      max-width: 52ch;
      color: var(--muted);
      line-height: 1.65;
    }
    a {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 12px 18px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      color: #15100a;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="./assets/romeros-carpentry-symbol.png" alt="ROMERO'S CARPENTRY logo" />
    <span class="eyebrow">Request Sent</span>
    <h1>Thank you.</h1>
    <p>Your estimate request has been received. ROMERO'S CARPENTRY will review the project details and follow up with the next step.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
